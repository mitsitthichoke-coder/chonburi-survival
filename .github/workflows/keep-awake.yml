# ⏰ ยิงเซิร์ฟเวอร์ Render ทุก ~10 นาที ไม่ให้หลับ (และปลุกถ้าหลับไปแล้ว)
# หมายเหตุ: GitHub อาจเลื่อนคิวได้ 5–15 นาทีช่วงคนใช้เยอะ · repo สาธารณะใช้ Actions ฟรี
# ปิดได้ด้วยการลบไฟล์นี้ หรือ Actions → Keep awake → Disable workflow
name: Keep awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping healthz
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://chonburi-survival.onrender.com/healthz || echo 000)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] || [ "$code" = "503" ] && exit 0
            sleep 20
          done
          exit 0
