# Render Blueprint: กด New → Blueprint แล้วเลือก repo นี้
# ตอนนี้ตั้งเป็นแบบฟรี (ทดลองเล่น): ข้อมูลบัญชี/ตัวละครจะหายเมื่อเซิร์ฟเวอร์รีสตาร์ต และเซิร์ฟเวอร์จะหลับเมื่อไม่มีคนเล่น 15 นาที
# พร้อมเปิดจริงเมื่อไหร่: เปลี่ยน plan เป็น starter แล้วเอาเครื่องหมาย # หน้า disk ออก เพื่อเก็บข้อมูลถาวร
services:
  - type: web
    name: chonburi-survival
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: MAX_PLAYERS
        value: "40"
      # รหัสยืนยันเจ้าของ: ไม่ต้องตั้ง เซิร์ฟเวอร์จะสุ่มและแสดงใน Logs ให้เอง
    # เปิดใช้ดิสก์ถาวร (แบบเสียเงิน): เอา # ด้านล่างออก แล้วเพิ่ม env DATA_DIR=/var/data
    # disk:
    #   name: game-data
    #   mountPath: /var/data
    #   sizeGB: 1
